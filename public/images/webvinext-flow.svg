<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img" aria-labelledby="title description">
  <title id="title">MDX source → generated content modules → Vinext/React App Router → Cloudflare Worker</title>
  <desc id="description">The source is content/projects/webvinext-site.mdx. scripts/generate-mdx-content.mjs compiles it into a generated module exporting a compiled MDX component, frontmatter, and raw content. lib/content/loader.ts imports generated project modules and validates project metadata; the project route renders the content in the Vinext and React App Router. worker/index.ts provides the Cloudflare Worker entry and delegates application requests to Vinext’s App Router handler. The four visible stages abbreviate this repository-based path as MDX, Modules, App, and Worker.</desc>
